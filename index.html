<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
    <header>la calculette</header>
    <div class="Calculator">
        <div class="container">
            <div id="monitor"></div>
            <div class="digits">
            <button  id="ac">AC</button>
            <button class="buttons" class="op" id="sign" value=" +/- ">+/-</button> 
            <button class="buttons" class="op" id="percent" value=" % ">%</button>
            <button class="buttons" class="op" id="divide" value=" / ">÷</button>
            <button class="buttons"  id="seven" value="7">7</button>
            <button class="buttons"  id="eight" value="8">8</button>
            <button class="buttons"  id="nine" value="9">9</button>
            <button class="buttons" class="op" id="multiply" value=" * ">X</button>
            <button class="buttons"  id="four" value="4">4</button>
            <button class="buttons"  id="five" value="5">5</button>
            <button class="buttons"  id="six" value="6">6</button>
            <button class="buttons" class="op" id="subtract" value=" - ">-</button>
            <button class="buttons"  id="one" value="1">1</button>
            <button class="buttons"  id="two" value="2">2</button>
            <button class="buttons"  id="three" value="3">3</button>
            <button class="buttons" class="op" id="plus" value=" + ">+</button>
            <button class="buttons"  id="zero" value="0">0</button>
            <button class="buttons" class="op" id="power" value =" ** ">^</button>
            <button class="buttons"  id="dot" value=".">•</button>
            <button id="equals">=</button>
            </div>
        </div>
    </div>
    <footer>Made by PinkPineapple.</footer>
</body>
</html>
